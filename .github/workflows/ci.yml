name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses : actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with maven wrapper
        shell: bash
        run: |
          set -e
          if find . -name pom.xml -print -quit | grep -q .; then
            echo "Found pom.xml files, building..."
            ./mvnw -B -ntp test
          else
            echo "No pom.xml found yet. Skipping maven build."
          fi
